name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_versions.py
      - run: python -m pip check
      - run: python -m pytest

  frontend:
    name: Frontend tests, build and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  macos:
    name: macOS arm64 tests and package
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_HTTP_MULTIPLEXING: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: test "$(uname -m)" = arm64
      - run: rustup update stable --no-self-update && rustup default stable
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci
        working-directory: desktop
      - run: npm run build:sidecar
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: npm run tauri build -- --bundles app,dmg -- --locked
        working-directory: desktop
      - run: codesign --verify --deep --strict desktop/src-tauri/target/release/bundle/macos/Farello.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Farello-macos-arm64-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
