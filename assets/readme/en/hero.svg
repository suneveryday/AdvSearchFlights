<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Farello</title>
  <desc id="desc">A macOS flight search and monitoring tool that combines Shanghai, Melbourne, and Sydney into open-jaw route options.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e9ee6"/>
      <stop offset="1" stop-color="#79d6c8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <g transform="translate(64 52)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="18" fill="#79d6c8" font-size="15" font-weight="700" letter-spacing="2.4">LOCAL-FIRST FLIGHT SEARCH · macOS + CLI</text>
    <text x="0" y="102" fill="#f7fbff" font-size="76" font-weight="750" letter-spacing="-2">Farello</text>
    <text x="0" y="149" fill="#c8d7e8" font-size="23">Search beyond the simple round trip.</text>
    <text x="0" y="184" fill="#c8d7e8" font-size="23">Combine routes, compare prices, watch the fare.</text>
    <g transform="translate(0 230)" font-size="15" font-weight="650">
      <rect width="138" height="38" rx="19" fill="#5e9ee6" fill-opacity=".16" stroke="#5e9ee6" stroke-opacity=".45"/>
      <text x="69" y="24" text-anchor="middle" fill="#b9d9fb">1–5 destinations</text>
      <rect x="150" width="112" height="38" rx="19" fill="#79d6c8" fill-opacity=".13" stroke="#79d6c8" stroke-opacity=".42"/>
      <text x="206" y="24" text-anchor="middle" fill="#bcebe4">open-jaw</text>
      <rect x="274" width="136" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="342" y="24" text-anchor="middle" fill="#d8e4ef">price alerts</text>
    </g>
  </g>
  <g transform="translate(644 38)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="500" height="344" rx="22" fill="#07111f" fill-opacity=".78" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="28" y="38" fill="#8499ae" font-size="13" letter-spacing="1.4">ROUTE COMBINATION / OPEN-JAW</text>
    <path d="M93 139 C168 70 261 74 337 131" fill="none" stroke="url(#route)" stroke-width="4" stroke-linecap="round"/>
    <path d="M337 146 C309 216 251 240 184 255" fill="none" stroke="#79d6c8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 9"/>
    <path d="M184 270 C138 258 102 226 91 174" fill="none" stroke="#5e9ee6" stroke-width="4" stroke-linecap="round"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <circle cx="90" cy="155" r="11" fill="#5e9ee6"/><circle cx="337" cy="140" r="11" fill="#79d6c8"/><circle cx="183" cy="263" r="11" fill="#79d6c8"/>
      <text x="67" y="121" fill="#f7fbff" font-size="25" font-weight="750">PVG</text><text x="59" y="190" fill="#8499ae" font-size="13">SHANGHAI</text>
      <text x="319" y="106" fill="#f7fbff" font-size="25" font-weight="750">MEL</text><text x="298" y="177" fill="#8499ae" font-size="13">MELBOURNE</text>
      <text x="163" y="306" fill="#f7fbff" font-size="25" font-weight="750">SYD</text><text x="158" y="328" fill="#8499ae" font-size="13">SYDNEY</text>
    </g>
    <g transform="translate(363 198)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <rect width="108" height="104" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="16" y="25" fill="#8499ae" font-size="11" font-weight="700">MONITOR</text>
      <text x="16" y="52" fill="#f7fbff" font-size="23" font-weight="750">8 h</text>
      <path d="M16 72H92" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="16" y="91" fill="#79d6c8" font-size="12" font-weight="700">↓ NEW LOW</text>
    </g>
  </g>
</svg>
