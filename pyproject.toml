[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AdvSearchFlights"
version = "0.10.5"
description = "Open-jaw flight search and monitoring with Google Flights first and optional Skyscanner fallback."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28",
  "pydantic>=2",
  "flights>=0.9.0",
  "socksio>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.11"]

[project.scripts]
adv-search-flights = "adv_search_flights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
